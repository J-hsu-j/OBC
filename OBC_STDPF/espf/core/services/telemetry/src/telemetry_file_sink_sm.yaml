---
telemetry_file_sink_sm:
    states:
        - Not_Init:
            transitions:
                - Init:
                    - { event: init }
            attributes:
               on_entry: False
               on_exit: False

        - Init:
            transitions:
               - Wait_Storage:
                  - { event: start, action: reload_config }
               - "__self":
                  - { event: "__periodic", action: reload_config }
            attributes:
               on_exit: False

        - Wait_Storage:
           transitions:
              - Started:
                 - { event: "__periodic", guard: is_storage_available, action: prepare_file_telemetry }
           attributes:
              on_entry: False
              on_exit: False

        - Started:
           transitions:
              - Stopped:
                 - { event: stop }
              - "__self":
                 - { event: "__periodic", guard: is_storage_available, action: store_telemetry }
              - Wait_Storage:
                 - { event: "__periodic", guard: is_storage_blocked }
              - Wait_Storage:
                 - { event: restart, action: clean_and_reload_cfg }
              - Wait_Cleanup:
                 - { event: file_cleanup_triggered }
           attributes:
              on_entry: False
              on_exit: False

        - Stopped:
           transitions:
              - Wait_Storage:
                 - { event: start }
              - "__self":
                 - { event: "__periodic", action: reload_config }
           attributes:
              on_entry: False
              on_exit: False

        - Wait_Cleanup:
           transitions:
              - Wait_Storage:
                 - { event: "__periodic", guard: is_cleanup_finished }
           attributes:
              on_entry: True
              on_exit: True
    attributes:
        initial: Not_Init
        instances: 2
